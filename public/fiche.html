<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B6E4F" />
  <title>Fiche d'identification — COMIX-CI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <style>
    :root {
      --vert: #0B6E4F; --vert-fonce: #07422F; --vert-clair: #E4F1EC;
      --orange: #E07A1F; --orange-fonce: #B35F14; --orange-clair: #FBEADA;
      --creme: #FAF8F3; --encre: #20241F; --ardoise: #69726B; --bord: #E4E0D6;
      --rouge: #B93B2E; --rouge-clair: #F8E7E4;
    }
    * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; overflow-x: hidden; background: var(--creme); overscroll-behavior: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--encre); line-height: 1.5; touch-action: manipulation; }
    header {
      background: linear-gradient(135deg, var(--vert-fonce), var(--vert));
      padding: calc(env(safe-area-inset-top) + 22px) 20px 26px; position: relative; color: #fff;
    }
    header::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--orange) 0 50%, #fff 50% 100%); }
    .marque { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--orange); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 22px; }
    h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
    .sous { font-size: 12px; opacity: .8; margin: 2px 0 0; }
    main { padding: 18px 16px 40px; max-width: 560px; margin: 0 auto; }
    .section { background: #fff; border: 1.5px solid var(--bord); border-radius: 15px; padding: 16px; margin-bottom: 14px; }
    .section h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--vert-fonce); margin: 0 0 12px; display: flex; align-items: center; gap: 7px; }
    .section h2 .puce { width: 8px; height: 8px; border-radius: 99px; background: var(--orange); flex-shrink: 0; }
    .ligne { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--bord); font-size: 14px; }
    .ligne:last-child { border-bottom: none; }
    .cle { color: var(--ardoise); flex-shrink: 0; }
    .val { font-weight: 700; text-align: right; word-break: break-word; }
    .val.mono { font-family: ui-monospace, monospace; }
    .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px; }
    .badge.ok { background: var(--vert-clair); color: var(--vert-fonce); }
    .badge.bientot { background: #FBF0D8; color: #A9740B; }
    .badge.perime { background: var(--rouge-clair); color: var(--rouge); }
    .badge.inconnu { background: #EEEDE7; color: var(--ardoise); }
    .personne { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .avatar { width: 46px; height: 46px; border-radius: 99px; background: var(--creme); border: 2px solid var(--bord); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--ardoise); overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nom { font-size: 15.5px; font-weight: 800; }
    .num { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--orange-fonce); font-weight: 700; }
    .vide { text-align: center; color: var(--ardoise); font-size: 13.5px; padding: 10px 0; }
    .placeholder { background: var(--creme); border: 1.5px dashed var(--bord); color: var(--ardoise); font-size: 13px; text-align: center; padding: 16px; border-radius: 11px; }
    footer { text-align: center; font-size: 11px; color: var(--ardoise); padding: 10px 16px calc(env(safe-area-inset-bottom) + 26px); }
    footer b { color: var(--encre); font-weight: 700; }
    #etat { text-align: center; padding: 60px 20px; color: var(--ardoise); font-size: 14px; }
    /* ---- Compte ORZAYAH ---- */
    .orz { --nuit: #0D1B3E; --or: #00A152; }
    .orz-entete { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .orz-marque { height: 34px; width: auto; display: block; }
    .orz-sous { font-size: 10.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #00A152; margin-top: 4px; }
    .orz-actif { background: var(--vert-clair); color: var(--vert-fonce); }
    .orz-qr { display: flex; justify-content: center; margin: 4px 0 12px; }
    .orz-qr img { width: 220px; max-width: 70vw; height: auto; aspect-ratio: 1; background: #fff; padding: 8px; border: 2px solid #0D1B3E; border-radius: 14px; }
    .orz-benef { text-align: center; font-size: 15px; font-weight: 800; }
    .orz-compte { text-align: center; font-family: ui-monospace, monospace; font-size: 13px; color: var(--ardoise); margin-top: 2px; }
    .orz-payer { display: block; text-align: center; margin: 14px 0 10px; padding: 14px; border-radius: 12px; background: #0D1B3E; color: #fff; font-weight: 800; font-size: 15px; text-decoration: none; }
    .orz-moyens { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .orz-moyens { align-items: center; }
    .orz-op { width: 44px; height: 44px; border-radius: 9px; object-fit: cover; border: 1px solid #E3E6EE; }
    .orz-carte { display: inline-flex; align-items: center; justify-content: center; height: 44px; min-width: 70px; padding: 0 10px; font-size: 12px; font-weight: 800; color: #0D1B3E; background: #fff; border: 1px solid #E3E6EE; border-radius: 9px; }
    .orz-carte img { height: 34px; width: auto; }
    .orz-autres { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bord); }
    .orz-autres h3 { font-size: 12px; font-weight: 800; color: var(--ardoise); text-transform: uppercase; letter-spacing: .4px; margin: 0 0 8px; }
    .orz-mini { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .orz-mini img { width: 84px; height: 84px; background: #fff; padding: 4px; border: 1.5px solid #0D1B3E; border-radius: 10px; flex-shrink: 0; }
    .orz-mini a { color: #0D1B3E; font-weight: 800; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="marque">
      <div class="logo">🚍</div>
      <div>
        <h1>Fiche d'identification</h1>
        <p class="sous">Véhicule · Transporteur · Chauffeur(s)</p>
      </div>
    </div>
  </header>

  <main id="contenu">
    <div id="etat">Chargement de la fiche…</div>
  </main>

  <footer>© <span id="annee"></span> <b>ORZAYAH SOLUTIONS</b></footer>

  <script>
    document.getElementById("annee").textContent = new Date().getFullYear();

    function badgeDocument(dateStr) {
      if (!dateStr) return '<span class="badge inconnu">Non renseigné</span>';
      const d = new Date(dateStr);
      const jours = Math.round((d - new Date()) / 86400000);
      const affichee = d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
      if (jours < 0) return `<span class="badge perime">Périmé — ${affichee}</span>`;
      if (jours <= 30) return `<span class="badge bientot">Valide (${jours} j) — ${affichee}</span>`;
      return `<span class="badge ok">Valide — ${affichee}</span>`;
    }

    // Échappement des textes injectés dans le HTML de la section ORZAYAH.
    function esc(x) {
      return String(x == null ? "" : x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function imgSure(src) { return typeof src === "string" && src.startsWith("data:image/") ? src : ""; }
    function urlSure(u) { return typeof u === "string" && u.startsWith("https://") ? u : ""; }
    // Logos officiels des moyens de paiement (public/brand/moyens/).
    // Carte bancaire : un seul visuel (cartes-bancaires.png).
    const OPERATEURS_ORZAYAH = [
      ["Orange Money", "orange-money"], ["MTN MoMo", "mtn-money"], ["Moov Money", "moov-money"], ["Wave", "wave"],
    ];

    function avatarHtml(photoUrl, nom, prenoms) {
      const init = ((prenoms || "?")[0] || "") + ((nom || "?")[0] || "");
      return photoUrl
        ? `<div class="avatar"><img src="${photoUrl}" alt="" /></div>`
        : `<div class="avatar">${init.toUpperCase()}</div>`;
    }

    async function charger() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const zone = document.getElementById("contenu");
      if (!id) { zone.innerHTML = '<div id="etat">Adresse incomplète — aucun identifiant de dossier fourni.</div>'; return; }

      let data;
      try {
        const r = await fetch(`/api/vehicules?resource=fiche-publique&id=${encodeURIComponent(id)}`);
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Dossier introuvable.");
        data = await r.json();
      } catch (err) {
        zone.innerHTML = `<div id="etat">${err.message || "Ce dossier n'existe pas ou n'est plus accessible."}</div>`;
        return;
      }

      const v = data.vehicule, t = data.transporteur, chs = data.chauffeurs || [], pf = data.pointFocal;

      let html = "";

      // Section 1 — Véhicule
      html += `<div class="section">
        <h2><span class="puce"></span>Véhicule</h2>
        <div class="ligne"><span class="cle">Immatriculation</span><span class="val mono">${v.immatriculation || "—"}</span></div>
        <div class="ligne"><span class="cle">Carte grise</span><span class="val mono">${v.carteGrise || "—"}</span></div>
        ${v.marque || v.modele ? `<div class="ligne"><span class="cle">Marque / Modèle</span><span class="val">${[v.marque, v.modele].filter(Boolean).join(" ")}</span></div>` : ""}
        ${v.categorie ? `<div class="ligne"><span class="cle">Catégorie</span><span class="val">${v.categorie}</span></div>` : ""}
        ${v.nombrePlaces ? `<div class="ligne"><span class="cle">Nombre de places</span><span class="val">${v.nombrePlaces}</span></div>` : ""}
        <div class="ligne"><span class="cle">Visite technique</span><span class="val">${badgeDocument(v.documents.visiteTechnique)}</span></div>
        <div class="ligne"><span class="cle">Assurance</span><span class="val">${badgeDocument(v.documents.assuranceAuto)}</span></div>
        <div class="ligne"><span class="cle">Vignette</span><span class="val">${badgeDocument(v.documents.vignette)}</span></div>
      </div>`;

      // Section 2 — Transporteur
      html += `<div class="section"><h2><span class="puce"></span>Transporteur</h2>`;
      if (t) {
        html += `<div class="personne">${avatarHtml(t.photoUrl, t.nom, t.prenoms)}<div><div class="nom">${t.prenoms} ${t.nom}</div><div class="num">${t.carteTransporteurNumero || "—"}</div>${t.contact1 ? `<div class="cle" style="margin-top:2px;">${t.contact1}</div>` : ""}</div></div>`;
      } else {
        html += `<div class="vide">Transporteur non renseigné.</div>`;
      }
      html += `</div>`;

      // Section 3 — Chauffeur(s), toujours sa propre section meme quand
      // elle est vide : c'est ce qui la rend reperable d'un coup d'oeil.
      html += `<div class="section"><h2><span class="puce"></span>Chauffeur${chs.length > 1 ? "s" : ""} (${chs.length})</h2>`;
      if (chs.length) {
        chs.forEach((c, i) => {
          html += `<div class="personne"${i > 0 ? ' style="margin-top:10px; padding-top:10px; border-top:1px solid var(--bord);"' : ""}>${avatarHtml(c.photoUrl, c.nom, c.prenoms)}<div><div class="nom">${c.prenoms} ${c.nom}</div><div class="num">${c.numeroCarte || "—"}</div>${c.contact1 ? `<div class="cle" style="margin-top:2px;">${c.contact1}</div>` : ""}</div></div>`;
        });
      } else {
        html += `<div class="vide">Aucun chauffeur rattaché à ce dossier pour l'instant.</div>`;
      }
      html += `</div>`;

      // Section 3 — Agent administratif (Point Focal de la gare/ligne)
      html += `<div class="section"><h2><span class="puce"></span>Agent administratif — Point Focal</h2>`;
      if (pf) {
        html += `<div class="ligne"><span class="cle">Gare</span><span class="val">${pf.gare || "—"}${pf.commune ? " — " + pf.commune : ""}</span></div>`;
        if (pf.chefGareNom) html += `<div class="ligne"><span class="cle">Chef de gare</span><span class="val">${pf.chefGareNom}${pf.chefGareContact ? " · " + pf.chefGareContact : ""}</span></div>`;
        if (pf.ligne) html += `<div class="ligne"><span class="cle">Ligne</span><span class="val">${pf.ligne}</span></div>`;
        if (pf.chefLigneNom) html += `<div class="ligne"><span class="cle">Chef de ligne</span><span class="val">${pf.chefLigneNom}${pf.chefLigneContact ? " · " + pf.chefLigneContact : ""}</span></div>`;
      } else {
        html += `<div class="vide">Aucune affectation active à une gare pour ce dossier.</div>`;
      }
      html += `</div>`;

      // Section 4 — Compte ORZAYAH : paiement marchand du transporteur
      // (+ chauffeurs disposant de leur propre compte lié).
      const orzT = t && t.orzayah && imgSure(t.orzayah.qrImage) ? t.orzayah : null;
      const orzC = chs.filter((c) => c.orzayah && imgSure(c.orzayah.qrImage));
      html += `<div class="section orz"><h2><span class="puce"></span>Compte ORZAYAH</h2>`;
      html += `<div class="orz-entete"><div><img class="orz-marque" src="/brand/orzayah-logo.png" alt="ORZAYAH" /><div class="orz-sous">Paiement marchand</div></div>
        ${orzT || orzC.length ? '<span class="badge orz-actif">Compte actif</span>' : '<span class="badge inconnu">Non activé</span>'}</div>`;
      if (orzT) {
        const lien = urlSure(orzT.url);
        html += `<div class="orz-qr"><img src="${imgSure(orzT.qrImage)}" alt="QR de paiement ORZAYAH" /></div>
          <div class="orz-benef">${esc(t.prenoms)} ${esc(t.nom)}</div>
          <div class="orz-compte">Compte ${esc(orzT.compte)}</div>
          ${lien ? `<a class="orz-payer" href="${esc(lien)}" target="_blank" rel="noopener">Payer ce transporteur via ORZAYAH</a>` : '<div style="height:12px"></div>'}`;
      } else {
        html += `<div class="placeholder">Le transporteur de ce véhicule n'a pas encore de compte ORZAYAH actif.</div><div style="height:12px"></div>`;
      }
      html += `<div class="orz-moyens">
        ${OPERATEURS_ORZAYAH.map(([n, f]) => `<img class="orz-op" src="/brand/moyens/${f}.png" alt="${n}" title="${n}" />`).join("")}
        <span class="orz-carte"><img src="/brand/moyens/cartes-bancaires.png" alt="Carte bancaire" /></span>
      </div>`;
      if (orzC.length) {
        html += `<div class="orz-autres"><h3>Chauffeur${orzC.length > 1 ? "s" : ""} — compte${orzC.length > 1 ? "s" : ""} ORZAYAH</h3>`;
        orzC.forEach((c) => {
          const lien = urlSure(c.orzayah.url);
          html += `<div class="orz-mini"><img src="${imgSure(c.orzayah.qrImage)}" alt="QR ORZAYAH" />
            <div><div class="nom">${esc(c.prenoms)} ${esc(c.nom)}</div><div class="orz-compte" style="text-align:left">Compte ${esc(c.orzayah.compte)}</div>
            ${lien ? `<a href="${esc(lien)}" target="_blank" rel="noopener">Payer ce chauffeur →</a>` : ""}</div></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;

      zone.innerHTML = html;
    }

    charger();
  </script>
</body>
</html>
